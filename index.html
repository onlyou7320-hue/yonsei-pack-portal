<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>상온포장팀 포털</title>
<meta name="theme-color" content="#0d5c7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* 상단 바 + 탭(OEE 현황 · 입력 · 휴무 체크 · 바로가기 · 관리) — 요약 먼저, 상세는 아래 */
:root{
  --bg:#f3f5f6; --surface:#fff; --sunken:#e8ecee; --line:#d3d9dc; --line2:#e6eaec;
  --fg:#17212a; --muted:#5b6872; --accent:#0d5c7a; --accent-ink:#fff; --accent-soft:#dbecf2;
  --good:#1d7a46; --good-soft:#dcf1e4; --warn:#a96a00; --warn-soft:#fbefd4; --bad:#b3261e; --bad-soft:#f9dedb;
  --sat:#2f5fb3; --sun:#b3261e; --night:#1f2a37; --night-ink:#fff;
  --c1:#8b95a7; --c2:#d64545; --c3:#7b5cd6; --c4:#e0a030; --c5:#2f6fd6; --c6:#6b7685; --c7:#12a39a; --c8:#1f3b7a;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f161b; --surface:#17212a; --sunken:#1f2b34; --line:#2e3c46; --line2:#24313a;
  --fg:#e6edf1; --muted:#9aa9b3; --accent:#5fb6d6; --accent-ink:#06222e; --accent-soft:#16384a;
  --good:#5ccf8a; --good-soft:#163a26; --warn:#f0b54a; --warn-soft:#3d2d0c; --bad:#ff8a80; --bad-soft:#47201d;
  --sat:#86aef5; --sun:#ff8a80; --night:#e6edf1; --night-ink:#0f161b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:700}
.brand span{font-size:12px;color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.who b{color:var(--fg)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{flex:0 0 auto;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent}
nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 56px;display:grid;gap:18px}
h2{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
h3{margin:0 0 10px;font-size:15px;font-weight:700}
h3 small,h4 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.notice.err{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=number],input[type=time],.mono{font-family:var(--mono)}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:7px;padding:9px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;padding:3px;text-decoration:underline}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.range{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.range label{width:auto}
.empty{color:var(--muted);font-size:14px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:10px;line-height:1.7}
.mu{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* OEE */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .ct b{font-size:16px}.card .ct span{font-size:12px;color:var(--muted)}
.big{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);margin-top:5px}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}
.apq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.apq div{background:var(--sunken);border-radius:7px;padding:6px 8px;display:grid}
.apq small{font-size:11px;color:var(--muted)}.apq b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span{color:var(--muted)}.kv b{text-align:right;font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.stack i{display:block;height:100%}
.leg{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));font-size:13px}
.leg li{display:flex;gap:8px;align-items:center}.leg li i{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.leg li b{margin-left:auto;font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.g{background:var(--good-soft)}.pill.w{background:var(--warn-soft)}.pill.b{background:var(--bad-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;background:var(--sunken);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;background:var(--sunken);border-radius:9px;padding:12px}
.calc div{display:grid;gap:1px}.calc small{font-size:11px;color:var(--muted)}
.calc b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.calc .o b{color:var(--accent);font-size:21px}
.stopform{display:grid;grid-template-columns:110px 110px minmax(150px,1fr) 90px minmax(0,2fr) auto;gap:8px;align-items:end}
@media (max-width:760px){.stopform{grid-template-columns:1fr 1fr}.stopform .wide{grid-column:1/-1}}
td select{font-size:13px;padding:4px 6px}
td input{font-size:13px;padding:4px 6px}

/* 휴무 */
.leg2{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;align-items:center}
.leg2 span{display:inline-flex;gap:5px;align-items:center}
.off{border-collapse:collapse;font-size:12.5px;width:auto}
.off th,.off td{border:1px solid var(--line2);padding:2px;text-align:center;position:relative}
.off th{font-size:11.5px;padding:4px 2px;min-width:30px}
.off th small{display:block;font-weight:400;font-size:10px}
.off th.sun{color:var(--sun)}.off th.sat{color:var(--sat)}
.off td.we{background:var(--sunken)}
.off .nm{position:sticky;left:0;background:var(--surface);text-align:left;padding:4px 10px;white-space:nowrap;z-index:2;font-weight:600}
.off tr.sep td{background:var(--sunken);text-align:left;font-weight:700;font-size:12px;padding:4px 10px}
.off tr.mine td{background:var(--accent-soft)}.off tr.mine .nm{color:var(--accent)}
.off tfoot td{font-size:11.5px;font-weight:700;background:var(--sunken)}
.cell{display:inline-grid;place-items:center;width:28px;height:26px;border:0;border-radius:5px;background:transparent;font:inherit;font-weight:700;font-size:12px;color:inherit;padding:0}
button.cell{cursor:pointer}button.cell:hover{outline:1px solid var(--accent)}
.cell.k-off{background:var(--bad-soft);color:var(--bad)}.cell.k-am{background:var(--warn-soft);color:var(--warn)}
.cell.k-pm{background:var(--accent-soft);color:var(--accent)}.cell.k-nt{background:var(--night);color:var(--night-ink)}.cell.k-ed{background:var(--good-soft);color:var(--good)}
.menu{position:absolute;z-index:30;top:100%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:grid;min-width:150px;padding:4px}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;border-radius:6px;color:var(--fg);white-space:nowrap}
.menu button:hover{background:var(--accent-soft)}
.off td.pk{z-index:5}

/* 바로가기 · 로그인 */
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.links a{display:grid;gap:4px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.links a b{font-size:15px}.links a span{font-size:13px;color:var(--muted)}
.links a:hover{border-color:var(--accent)}
.auth{max-width:420px;margin:40px auto;display:grid;gap:14px}
.tabs2{display:flex;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{display:inline-flex;align-items:center;gap:2px;font-size:13px;background:var(--sunken);border-radius:999px;padding:3px 4px 3px 10px}
.chips button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 6px}
.srcbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}.dot.ok{background:var(--good)}
tr.click.on{background:var(--accent-soft)}tr.det>td{background:var(--bg);white-space:normal;padding:14px}
.det-in{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}@media (max-width:900px){.det-in{grid-template-columns:1fr}}
.det-in h4{margin:0 0 8px;font-size:14px}.det-in .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
table.st{font-size:12.5px}table.st td{padding:5px 6px}.tag.ok{background:var(--good-soft);color:var(--good)}
sup{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><h1>상온포장팀 포털</h1><span>상온제품생산부문 · 상온제품포장팀</span></div>
      <div class="who" id="who"></div>
    </div>
    <nav id="nav" aria-label="메뉴" hidden>
      <a href="#oee" data-t="oee">OEE 현황</a>
      <a href="#off" data-t="off">휴무 체크</a>
      <a href="#links" data-t="links">일지 작성</a>
      <a href="#admin" data-t="admin" id="navAdmin" hidden>관리</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">불러오는 중…</div></main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ================= 기준값 (OEE 일일 기록 양식 「기준」 시트) ================= */
var LINES=['A','B','C','D','E','F'];
var CAPA={A:24000,B:24000,C:6000,D:24000,E:24000,F:40000};
var MAKER={A:'SIG (CFA-124)',B:'Tetra Pak',C:'Tetra Pak',D:'Tetra Pak',E:'SIG (CFA-1724)',F:'Tetra Pak'};
var CAPA_CHG=[{h:'D',from:'2026-10-30',cap:26500}];      /* D호기 Up-Speed 적용일 */
var CIP_EST={A:120,B:120,C:120,D:120,E:120,F:150};      /* CIP 종료가 없을 때 생산 종료 후 추정(분) */
var CODES=['계획정지','고장','준비교체','자재 대기','순간정지','기타','상류(유액) 대기','중간 CIP'];
var CODE_DESC=['계획된 정지 (교육, 휴식 등)','설비 이상으로 수리가 필요한 정지','품목 교체, 규격 변경 작업','포장재·부자재 대기','짧은 정지 후 리셋으로 재가동 (팩 걸림 등)','위 코드에 해당하지 않는 정지','멸균·배합 쪽 유액 공급 대기 (Dairy not ready 등)','생산 중 계획에 없던 CIP'];
var BRK_MIN=10;
function capOf(h,d){var c=CAPA[h]||null;CAPA_CHG.forEach(function(x){if(x.h===h&&d>=x.from)c=x.cap});return c}

/* ================= 도우미 ================= */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addD(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var DOW='일월화수목금토';
function dw(s){return DOW[new Date(s+'T00:00:00').getDay()]}
function md(s){return (+s.slice(5,7))+'/'+(+s.slice(8,10))}
function tmin(x){var m=String(x||'').match(/(\d{1,2})\s*[:시.]\s*(\d{2})/);if(!m)return null;var h=+m[1],mi=+m[2];if(h>47||mi>59)return null;return (h*60+mi)%1440}
function lastT(x){var a=String(x||'').match(/\d{1,2}\s*:\s*\d{2}/g);return a&&a.length?tmin(a[a.length-1]):null}
function hm(t){if(t==null)return '';t=((Math.round(t)%1440)+1440)%1440;return pad(Math.floor(t/60))+':'+pad(t%60)}
function span(a,b){if(a==null||b==null)return null;return (((b-a)%1440)+1440)%1440}
function num(x){if(x==null||x==='')return null;var m=String(x).replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null}
function pct(x){return x==null||!isFinite(x)?'<span class="mu">-</span>':(x*100).toFixed(1)+'%'}
function n0(x){return x==null||!isFinite(x)?'<span class="mu">-</span>':Math.round(x).toLocaleString('ko-KR')}
function grade(x){return x==null?'':x>=0.85?'g':x>=0.65?'w':'b'}
function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2600)}
function classify(why,min){var t=String(why||'');
 if(/중간\s*C\.?I\.?P|중간\s*세척/i.test(t))return 8;
 if(/유액|전처리|dairy\s*not\s*ready|product\s*not|멸균(기)?\s*(대기|이상|깨짐)|배합\s*대기|공급\s*대기|이송\s*대기|성분\s*미달/i.test(t))return 7;
 if(/휴식|교육|식사|점심|계획\s*정지/.test(t))return 1;
 if(/품목\s*(변경|교체)|제품\s*변경|규격\s*변경|레시피\s*변경/.test(t))return 3;
 if(/자재|포장재|팩\s*부족|트레이\s*(부족|대기|미입고)|스트로우\s*(부족|대기)|paper\s*(부족|대기)/i.test(t))return 4;
 if(min!=null&&min>=BRK_MIN)return 2;
 return 5}

/* ================= 데이터: 이 사이트(Supabase) ================= */
var CFG=window.PACK_CFG||{};
var DEMO=!(CFG.url&&CFG.key&&window.supabase);
var sb=DEMO?null:window.supabase.createClient(CFG.url,CFG.key);
var EMAIL_PATTERN=CFG.emailPattern||'{emp}@yonsei-pack.local';
function authEmail(emp){return EMAIL_PATTERN.replace('{emp}',emp)}
var ME=null;
var LS='pack_demo_v1';
function L(){var o;try{o=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}if(!o)o={daily:[],stops:[],roster:[],off:[],seq:1};return o}
function LW(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
function chk(r){if(r.error)throw r.error;return r.data}
var api={
 daily:function(from,to){if(DEMO)return Promise.resolve(L().daily.filter(function(x){return x.d>=from&&x.d<=to}));
  return sb.from('oee_daily').select('*').gte('d',from).lte('d',to).order('d').then(chk)},
 saveDaily:function(row){row.updated_by=ME.name;row.updated_at=new Date().toISOString();
  if(DEMO){var o=L();var old=o.daily.filter(function(x){return x.d===row.d&&x.line===row.line})[0]||{};o.daily=o.daily.filter(function(x){return !(x.d===row.d&&x.line===row.line)});o.daily.push(Object.assign(old,row));LW(o);return Promise.resolve()}
  return sb.from('oee_daily').upsert(row,{onConflict:'d,line'}).then(chk)},
 stops:function(from,to){if(DEMO)return Promise.resolve(L().stops.filter(function(x){return x.d>=from&&x.d<=to}));
  return sb.from('oee_stops').select('*').gte('d',from).lte('d',to).order('d').range(0,9999).then(chk)},
 addStops:function(rows){rows.forEach(function(r){r.created_by=ME.name});if(DEMO){var o=L();rows.forEach(function(r){r.id=o.seq++;o.stops.push(r)});LW(o);return Promise.resolve()}
  return sb.from('oee_stops').insert(rows).then(chk)},
 updStop:function(id,patch){if(DEMO){var o=L();o.stops.forEach(function(x){if(x.id===id)Object.assign(x,patch)});LW(o);return Promise.resolve()}
  return sb.from('oee_stops').update(patch).eq('id',id).then(chk)},

function dkey(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function srcDays(from,to){var out={},by={};
 SRC.runs.forEach(function(r){var D=dkey(r.start);if(D<from||D>to)return;var k=D+'|'+MC[r.mi];(by[k]=by[k]||[]).push(r)});
 Object.keys(by).forEach(function(k){var rs=by[k].sort(function(a,b){return a.start-b.start}),p=k.split('|'),o={d:p[0],line:p[1],runs:rs,stops:[]};
  o.psMs=rs[0].start;o.peMs=rs.reduce(function(m,r){return Math.max(m,r.end)},0);o.ps=mod(o.psMs);o.pe=mod(o.peMs);

   var nx=rs[i+1];if(nx&&nx.start>r.end){var g=Math.round((nx.start-r.end)/60000);if(g>0)o.stops.push({a:mod(r.end),b:mod(nx.start),aMs:r.end,m:g,why:'품목 교체 — '+(r.item||'')+' → '+(nx.item||''),src:'생산 기록 사이',code:3})}});

   return t+rate*Math.max(0,(r.end-r.start)/60000-own)/60},0);

 return out}

/* ================= 멸균팀 업무일지 → 멸균기 생산량(L) ================= */
var STER={rows:[],info:null,state:'idle',err:''};
function recKey(r,re){var ks=Object.keys(r||{});for(var i=0;i<ks.length;i++)if(re.test(ks[i]))return ks[i];return null}
function recL(r){var k=recKey(r,/생산량.*L|^L$|liter|litre|prodL|qtyL|amountL|volL|totalL|^l_|_l$/i)||recKey(r,/생산량|prod(uct)?(ion)?_?qty|amount|volume/i);return k?num(r[k]):null}
function recItem(r){var k=recKey(r,/품목|item|product|제품|품명/i);return k?String(r[k]||''):''}
function toks(s){return String(s||'').replace(/\(.*?\)|외\s*\d+\s*종/g,' ').split(/[\s,·/+&]+/).map(function(t){return t.replace(/[^가-힣A-Za-z0-9]/g,'')}).filter(function(t){return t.length>=2})}
function simil(a,b){var A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;var n=0;A.forEach(function(t){if(B.some(function(u){return u.indexOf(t)>=0||t.indexOf(u)>=0}))n++});return n/A.length}
/* 같은 날 멸균 호기별 합계를 만들고, 포장기 품목과 가장 닮은 호기를 고름 (보완 입력의 「연결 멸균호기」가 있으면 그 호기) */
function sterFor(o){var day=STER.rows.filter(function(x){return x.d===o.d&&x.unit!=null});if(!day.length)return null;var by={};
 day.forEach(function(x){var u=x.unit;by[u]=by[u]||{unit:u,L:0,n:0,items:[]};var l=recL(x.rec);if(l!=null){by[u].L+=l;by[u].n++}var it=recItem(x.rec);if(it&&by[u].items.indexOf(it)<0)by[u].items.push(it)});
 var want=num(o.sup&&o.sup.ster);if(want!=null&&by[want])return Object.assign({how:'지정'},by[want]);
 var best=null;Object.keys(by).forEach(function(u){var c=by[u],sc=simil(o.item,c.items.join(' '));if(sc>0&&(!best||sc>best.sc))best=Object.assign({sc:sc,how:'품목 일치'},c)});
 return best&&best.L?best:null}

/* ================= OEE 계산 (OEE 일일 기록 양식과 같은 식) ================= */
function build(from,to,daily,stops){var J=SRC.state==='ok'?srcDays(from,to):{},sup={},man={};
 daily.forEach(function(r){sup[r.d+'|'+r.line]=r});stops.forEach(function(s){var k=s.d+'|'+s.line;(man[k]=man[k]||[]).push(s)});
 var keys={};Object.keys(J).forEach(function(k){keys[k]=1});daily.forEach(function(r){if(r.qty!=null||r.ps)keys[r.d+'|'+r.line]=1});
 return Object.keys(keys).map(function(k){var j=J[k],s=sup[k]||{},p=k.split('|'),o={d:p[0],line:p[1],sup:s,j:j||null};
  var pick=function(f,jv){return s[f]!=null&&s[f]!==''?s[f]:jv};
  if(j){o.src='생산 기록';o.item=pick('item',j.item);o.ps=s.ps?tmin(s.ps):j.ps;o.pe=s.pe?tmin(s.pe):j.pe;o.qty=s.qty!=null?num(s.qty):j.qty;
   o.sipEst=!s.sip;o.sip=s.sip?tmin(s.sip):(o.ps-SIP_EST[o.line]+1440)%1440;
   o.cipEst=!s.cip;o.cip=s.cip?tmin(s.cip):(o.pe+CIP_EST[o.line])%1440;
   var ov=s.codes||{};o.stops=j.stops.map(function(x){var key=hm(x.a)+'|'+x.src,auto=x.code||classify(x.why,x.m),v=ov[key]||{},code=v.code||auto;
    return {key:key,a:x.a,b:x.b,min:x.m,why:x.why,auto:auto,code:code,brk:v.brk||(code===2?'Y':'N'),src:x.src}});
   o.rate=j.rate;o.planJ=j.plan;o.idealJ=j.ideal;
   o.prodSpan=(s.ps||s.pe)?span(o.ps,o.pe):j.prodSpanMs}
  else{o.src='엑셀';o.item=s.item;o.sip=tmin(s.sip);o.ps=tmin(s.ps);o.pe=tmin(s.pe);o.cip=tmin(s.cip);o.qty=num(s.qty);o.prodSpan=span(o.ps,o.pe);
   o.stops=(man[k]||[]).map(function(x){var a=tmin(x.t_start),b=tmin(x.t_end);return {id:x.id,key:x.t_start,a:a,b:b,min:span(a,b),why:x.content,auto:+x.code||6,code:+x.code||6,brk:String(x.brk||'N').toUpperCase(),src:'엑셀'}})
    .sort(function(x,y){return (x.a||0)-(y.a||0)})}
  o.cap=o.rate||capOf(o.line,o.d);o.ml=num(s.ml);o.sterL=num(s.ster_l);o.sterSrc=o.sterL!=null?'입력':'';if(o.sterL==null){var sf=sterFor(o);if(sf){o.sterL=sf.L;o.sterSrc=sf.unit+'호기 ('+sf.how+')';o.sterUnit=sf.unit}}o.order=num(s.order_qty)||o.planJ||null;
  o.occ=span(o.sip,o.cip);o.down=o.stops.reduce(function(t,x){return t+(x.min||0)},0);
  o.net=o.prodSpan==null?null:o.prodSpan-o.down;
  o.A=(o.occ&&o.net!=null)?o.net/o.occ:null;
  o.ideal=(o.idealJ&&s.qty==null&&!s.ps&&!s.pe)?o.idealJ:((o.cap&&o.net)?o.cap*o.net/60:null);
  o.P=(o.qty!=null&&o.ideal)?o.qty/o.ideal:null;
  o.L=(o.qty!=null&&o.ml)?o.qty*o.ml/1000:null;o.Q=(o.L!=null&&o.sterL)?o.L/o.sterL:null;
  o.O=(o.A!=null&&o.P!=null&&o.Q!=null)?o.A*o.P*o.Q:null;o.AP=(o.A!=null&&o.P!=null)?o.A*o.P:null;o.ach=(o.qty!=null&&o.order)?o.qty/o.order:null;
  var bk=o.stops.filter(function(x){return x.brk==='Y'});o.brkN=bk.length;o.brkMin=bk.reduce(function(t,x){return t+(x.min||0)},0);
  o.miss=[];if(o.sip==null||o.sipEst)o.miss.push('SIP 시작');if(o.cip==null||o.cipEst)o.miss.push('CIP 종료');if(o.qty==null)o.miss.push('생산량');if(!o.ml)o.miss.push('용량');if(!o.sterL)o.miss.push('멸균기 적산량');
  return o})}
function agg(list){var s={n:list.length,occ:0,net:0,down:0,ideal:0,qty:0,L:0,sterL:0,ordQ:0,order:0,brkN:0,brkMin:0};
 list.forEach(function(r){if(r.occ&&r.net!=null){s.occ+=r.occ;s.net+=r.net}s.down+=r.down;if(r.ideal){s.ideal+=r.ideal;s.qty+=r.qty||0}
  if(r.L!=null&&r.sterL){s.L+=r.L;s.sterL+=r.sterL}if(r.order&&r.qty){s.order+=r.order;s.ordQ+=r.qty}s.brkN+=r.brkN;s.brkMin+=r.brkMin});
 s.A=s.occ?s.net/s.occ:null;s.P=s.ideal?s.qty/s.ideal:null;s.Q=s.sterL?s.L/s.sterL:null;s.O=(s.A!=null&&s.P!=null&&s.Q!=null)?s.A*s.P*s.Q:null;s.AP=(s.A!=null&&s.P!=null)?s.A*s.P:null;
 s.ach=s.order?s.ordQ/s.order:null;s.mtbf=s.brkN?s.net/s.brkN:null;s.mttr=s.brkN?s.brkMin/s.brkN:null;return s}

function needXLSX(){if(window.XLSX)return Promise.resolve();return new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=function(){no(new Error('엑셀 읽기 도구를 불러오지 못했습니다'))};document.head.appendChild(s)})}
function importFile(f,fn){if(!f)return;var box=$('#x-msg');box.innerHTML='<div class="notice info">읽는 중…</div>';
 needXLSX().then(function(){return f.arrayBuffer()}).then(function(buf){return fn(XLSX.read(buf,{type:'array'}))})
  .then(function(t){box.innerHTML='<div class="notice info">'+esc(t)+'</div>'}).catch(function(e){console.error(e);box.innerHTML='<div class="notice err">가져오지 못했습니다: '+esc(errMsg(e))+'</div>'})}
function xDate(v){if(v==null||v==='')return null;if(typeof v==='number'){var d=XLSX.SSF.parse_date_code(v);return d?d.y+'-'+pad(d.m)+'-'+pad(d.d):null}var m=String(v).match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):null}
function xTime(v){if(v==null||v==='')return null;if(typeof v==='number')return hm(Math.round((v%1)*1440));var m=tmin(v);return m==null?null:hm(m)}
function cellV(ws,r,c){var x=ws[XLSX.utils.encode_cell({r:r,c:c})];return x?x.v:null}
async function importOee(wb){var d=wb.Sheets['일일입력'],s=wb.Sheets['정지기록'];if(!d||!s)throw new Error('「일일입력」 · 「정지기록」 시트가 없습니다');
 var rg=XLSX.utils.decode_range(d['!ref']),days=[];
 for(var r=5;r<=rg.e.r;r++){var D=xDate(cellV(d,r,0)),h=String(cellV(d,r,2)||'').trim().toUpperCase();if(!D||LINES.indexOf(h)<0)continue;var qty=cellV(d,r,11),ps=xTime(cellV(d,r,8));if(qty==null&&!ps)continue;
  days.push({d:D,line:h,ster:cellV(d,r,3)==null?null:String(cellV(d,r,3)),item:cellV(d,r,4)||null,ml:num(cellV(d,r,5)),order_qty:num(cellV(d,r,6)),sip:xTime(cellV(d,r,7)),ps:ps,pe:xTime(cellV(d,r,9)),cip:xTime(cellV(d,r,10)),qty:num(qty),ster_l:num(cellV(d,r,12)),note:cellV(d,r,13)||null})}
 var rs=XLSX.utils.decode_range(s['!ref']),st=[];
 for(var r2=4;r2<=rs.e.r;r2++){var D2=xDate(cellV(s,r2,0)),h2=String(cellV(s,r2,1)||'').trim().toUpperCase();if(!D2||LINES.indexOf(h2)<0)continue;
  st.push({d:D2,line:h2,t_start:xTime(cellV(s,r2,2)),t_end:xTime(cellV(s,r2,3)),code:num(cellV(s,r2,4)),brk:String(cellV(s,r2,7)||'N').toUpperCase(),content:cellV(s,r2,8)==null?null:String(cellV(s,r2,8))})}
 if(!days.length)throw new Error('가져올 일일 입력이 없습니다');
 for(var i=0;i<days.length;i++)await api.saveDaily(days[i]);
 var keys={};days.concat(st).forEach(function(x){keys[x.d+'|'+x.line]=1});var ks=Object.keys(keys).sort(),from=ks[0].slice(0,10),to=ks[ks.length-1].slice(0,10),old=await api.stops(from,to);
 for(var j=0;j<old.length;j++)if(keys[old[j].d+'|'+old[j].line])await api.delStop(old[j].id);
 for(var k=0;k<st.length;k+=200)await api.addStops(st.slice(k,k+200));
 return '일일 기록 '+days.length+'건, 정지 기록 '+st.length+'건을 가져왔습니다 ('+md(from)+' ~ '+md(to)+').'}
async function importOff(wb){var names=wb.SheetNames.filter(function(n){return /휴무표/.test(n)});if(!names.length)throw new Error('「휴무표」 시트가 없습니다');
 var roster=null,cells=[],months=[];
 names.forEach(function(sn){var ws=wb.Sheets[sn],m=String(cellV(ws,0,0)||'').match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);if(!m)return;var ym=m[1]+'-'+pad(m[2]);months.push(ym);
  var rg=XLSX.utils.decode_range(ws['!ref']),cols=[];for(var c=2;c<=rg.e.c;c++){var dd=num(cellV(ws,3,c));if(dd)cols.push([c,dd])}
  var list=[],g2=null;
  for(var r=5;r<=rg.e.r;r++){var a=cellV(ws,r,0),n=cellV(ws,r,1);
   if(n==null||String(n).trim()===''){var gm=String(a||'').match(/2[조팀]\s*\(\s*(\d+)\s*~/);if(gm)g2=+gm[1];continue}
   n=String(n).trim();list.push({name:n,ord:num(a)||list.length+1});
   cols.forEach(function(cd){var v=cellV(ws,r,cd[0]);if(v!=null&&String(v).trim()!=='')cells.push({ym:ym,name:n,day:cd[1],val:String(v).trim()})})}
  list.forEach(function(p){p.grp=(g2&&p.ord>=g2)?2:1});if(!roster||ym>roster.ym)roster={ym:ym,list:list}});
 if(!roster)throw new Error('시트 제목에서 「2026년 11월」 같은 연월을 찾지 못했습니다');
 await api.saveRoster(roster.list.map(function(p,i){return {name:p.name,grp:p.grp,ord:i+1}}));
 for(var k=0;k<cells.length;k+=300)await api.setOff(cells.slice(k,k+300));
 return '명단 '+roster.list.length+'명('+roster.ym+' 기준)과 휴무 표시 '+cells.length+'칸을 가져왔습니다 ('+months.sort().join(', ')+').'}
