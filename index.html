<style>
/* 연세우유 상온제품생산부문 통합 업무포털과 같은 모양: 남색 상단 바 + 흰 왼쪽 메뉴 + 회색 바탕의 카드 */
:root{
  --navy:#0B2545; --navy2:#13315C; --gold:#C8A15A; --gold2:#E8D3A5;
  --bg:#F5F7FA; --surface:#FFFFFF; --sunken:#EEF2F7; --line:#E3E8EF; --line2:#EEF2F7;
  --fg:#16233A; --muted:#5B6B82; --faint:#93A1B5;
  --accent:#1D4E89; --accent-ink:#FFFFFF; --accent-soft:#EAF1F8;
  --good:#1B7F4E; --good-soft:#E8F5EE; --warn:#B7791F; --warn-soft:#FBF3E4; --bad:#B23A3A; --bad-soft:#FBECEC;
  --sat:#1D4E89; --sun:#B23A3A; --night:#16233A; --night-ink:#fff;
  --c1:#93A1B5; --c2:#B23A3A; --c3:#6A4FB3; --c4:#C8A15A; --c5:#1D4E89; --c6:#5B6B82; --c7:#1C8A86; --c8:#0B2545;
  --shadow:0 1px 2px rgba(11,37,69,.06),0 8px 24px rgba(11,37,69,.06);
  --body:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --mono:var(--body);
  --side:236px; --top:60px;
  color-scheme:light;
}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere}
/* 상단 바 */
.topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;white-space:nowrap;color:#fff;text-decoration:none}
.logo b{font-weight:600;opacity:.8}
.topbar .div{width:1px;height:22px;background:rgba(255,255,255,.22)}
.topbar .team{font-size:14px;font-weight:700;color:var(--gold2);white-space:nowrap}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap}
.who b{color:#fff}.who .tag{background:rgba(255,255,255,.14);color:#fff}.who .tag.warn{background:var(--gold);color:var(--navy)}
.who .link{color:#fff;opacity:.85}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px}
/* 왼쪽 메뉴 */
#nav{position:fixed;top:calc(var(--top) + env(safe-area-inset-top,0px));left:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 30px;z-index:30}
#nav .gt{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint);padding:16px 12px 6px}
#nav .gt:first-child{padding-top:4px}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg);text-decoration:none}
#nav a span{width:20px;text-align:center;color:var(--muted)}
#nav a:hover{background:var(--sunken)}
#nav a.on{background:var(--accent-soft);color:var(--accent)}#nav a.on span{color:var(--accent)}
#nav[hidden]{display:none!important}
#nav .foot{margin:22px 12px 0;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.6}
main{margin-left:var(--side);padding:calc(var(--top) + env(safe-area-inset-top,0px) + 24px) max(28px,env(safe-area-inset-right,0px)) 60px 28px;display:grid;gap:18px;max-width:1240px;min-width:0}
body.noside main{margin-left:0;margin-inline:auto}
@media (max-width:900px){
  #nav{top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:auto;right:0;width:auto;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  #nav .gt,#nav .foot{display:none}#nav a{flex:0 0 auto;padding:7px 12px;font-size:13.5px}
  main{margin-left:0;padding:calc(var(--top) + env(safe-area-inset-top,0px) + 70px) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  .topbar .team,.topbar .div,.logo b{display:none}
}
h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:2px}
.box,.card,.srcbar{box-shadow:var(--shadow)}
.btn{border-radius:9px}
/* 홈 */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 28px;background:linear-gradient(135deg,#0A1530 0%,#13315C 60%,#1D4E89 100%);color:#fff;display:grid;gap:6px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(232,211,165,.22),rgba(232,211,165,0) 70%)}
.hero .eyebrow{color:var(--gold2)}
.hero h2{font-size:24px;color:#fff}.hero p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:4px;border-top:3px solid var(--kc,var(--accent))}
.kpi .kl{font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi .kval{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.kpi .kval small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .ks{font-size:12.5px;color:var(--muted)}
.dash{display:grid;gap:14px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}@media (max-width:1000px){.dash{grid-template-columns:1fr}}
.hb{display:grid;gap:8px}.hb .r{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.hb .bar{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}.hb .bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.hb .r b{text-align:right}
*{box-sizing:border-box}













a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


h3{margin:0 0 10px;font-size:15px;font-weight:700}
h3 small,h4 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.notice.err{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=number],input[type=time],.mono{font-family:var(--mono)}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:7px;padding:9px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;padding:3px;text-decoration:underline}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.range{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.range label{width:auto}
.empty{color:var(--muted);font-size:14px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:10px;line-height:1.7}
.mu{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* OEE */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .ct b{font-size:16px}.card .ct span{font-size:12px;color:var(--muted)}
.big{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);margin-top:5px}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}
.apq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.apq div{background:var(--sunken);border-radius:7px;padding:6px 8px;display:grid}
.apq small{font-size:11px;color:var(--muted)}.apq b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span{color:var(--muted)}.kv b{text-align:right;font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.stack i{display:block;height:100%}
.leg{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));font-size:13px}
.leg li{display:flex;gap:8px;align-items:center}.leg li i{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.leg li b{margin-left:auto;font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.g{background:var(--good-soft)}.pill.w{background:var(--warn-soft)}.pill.b{background:var(--bad-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;background:var(--sunken);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;background:var(--sunken);border-radius:9px;padding:12px}
.calc div{display:grid;gap:1px}.calc small{font-size:11px;color:var(--muted)}
.calc b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.calc .o b{color:var(--accent);font-size:21px}
.stopform{display:grid;grid-template-columns:110px 110px minmax(150px,1fr) 90px minmax(0,2fr) auto;gap:8px;align-items:end}
@media (max-width:760px){.stopform{grid-template-columns:1fr 1fr}.stopform .wide{grid-column:1/-1}}
td select{font-size:13px;padding:4px 6px}
td input{font-size:13px;padding:4px 6px}

/* 휴무 */
.leg2{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;align-items:center}
.leg2 span{display:inline-flex;gap:5px;align-items:center}
.off{border-collapse:collapse;font-size:12.5px;width:auto}
.off th,.off td{border:1px solid var(--line2);padding:2px;text-align:center;position:relative}
.off th{font-size:11.5px;padding:4px 2px;min-width:30px}
.off th small{display:block;font-weight:400;font-size:10px}
.off th.sun{color:var(--sun)}.off th.sat{color:var(--sat)}
.off td.we{background:var(--sunken)}
.off .nm{position:sticky;left:0;background:var(--surface);text-align:left;padding:4px 10px;white-space:nowrap;z-index:2;font-weight:600}
.off tr.sep td{background:var(--sunken);text-align:left;font-weight:700;font-size:12px;padding:4px 10px}
.off tr.mine td{background:var(--accent-soft)}.off tr.mine .nm{color:var(--accent)}
.off tfoot td{font-size:11.5px;font-weight:700;background:var(--sunken)}
.cell{display:inline-grid;place-items:center;width:28px;height:26px;border:0;border-radius:5px;background:transparent;font:inherit;font-weight:700;font-size:12px;color:inherit;padding:0}
button.cell{cursor:pointer}button.cell:hover{outline:1px solid var(--accent)}
.cell.k-off{background:var(--bad-soft);color:var(--bad)}.cell.k-am{background:var(--warn-soft);color:var(--warn)}
.cell.k-pm{background:var(--accent-soft);color:var(--accent)}.cell.k-nt{background:var(--night);color:var(--night-ink)}.cell.k-ed{background:var(--good-soft);color:var(--good)}
.menu{position:absolute;z-index:30;top:100%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:grid;min-width:150px;padding:4px}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;border-radius:6px;color:var(--fg);white-space:nowrap}
.menu button:hover{background:var(--accent-soft)}
.off td.pk{z-index:5}

/* 바로가기 · 로그인 */
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.links a{display:grid;gap:4px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.links a b{font-size:15px}.links a span{font-size:13px;color:var(--muted)}
.links a:hover{border-color:var(--accent)}
.auth{max-width:420px;margin:40px auto;display:grid;gap:14px}
.tabs2{display:flex;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{display:inline-flex;align-items:center;gap:2px;font-size:13px;background:var(--sunken);border-radius:999px;padding:3px 4px 3px 10px}
.tm{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}.tm.t1{background:var(--sunken);color:var(--muted)}.tm.t2{background:var(--accent-soft);color:var(--accent)}
.chips button.tgl{color:var(--fg);font-size:13px;padding:0 2px}.chips button.tgl .tm{margin:0 2px 0 0}
table.hp th.c{text-align:center;border-bottom:1px solid var(--line2)}table.hp tr.sum td{font-weight:700;background:var(--sunken)}table.hp sup{font-size:10px;color:var(--accent);margin-left:3px}table.hp tr.empty-row td{color:var(--muted)}
.chips button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 6px}
.srcbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}.dot.ok{background:var(--good)}
tr.click.on{background:var(--accent-soft)}tr.det>td{background:var(--bg);white-space:normal;padding:14px}
.det-in{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}@media (max-width:900px){.det-in{grid-template-columns:1fr}}
.det-in h4{margin:0 0 8px;font-size:14px}.det-in .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
table.st{font-size:12.5px}table.st td{padding:5px 6px}.tag.ok{background:var(--good-soft);color:var(--good)}
sup{color:var(--warn);font-weight:700}
</style>
</head>

(function(){

/* ================= 도우미 ================= */

function addD(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function span(a,b){if(a==null||b==null)return null;return (((b-a)%1440)+1440)%1440}

function pct(x){return x==null||!isFinite(x)?'<span class="mu">-</span>':(x*100).toFixed(1)+'%'}

function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2600)}
function classify(why,min){var t=String(why||'');
 if(/중간\s*C\.?I\.?P|중간\s*세척/i.test(t))return 8;
 if(/유액|전처리|dairy\s*not\s*ready|product\s*not|멸균(기)?\s*(대기|이상|깨짐)|배합\s*대기|공급\s*대기|이송\s*대기|성분\s*미달/i.test(t))return 7;
 if(/휴식|교육|식사|점심|계획\s*정지/.test(t))return 1;
 if(/품목\s*(변경|교체)|제품\s*변경|규격\s*변경|레시피\s*변경/.test(t))return 3;
 if(/자재|포장재|팩\s*부족|트레이\s*(부족|대기|미입고)|스트로우\s*(부족|대기)|paper\s*(부족|대기)/i.test(t))return 4;
 if(min!=null&&min>=BRK_MIN)return 2;
 return 5}

/* ================= 데이터: 이 사이트(Supabase) ================= */

function LW(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
function chk(r){if(r.error)throw r.error;return r.data}
var api={
 daily:function(from,to){if(DEMO)return Promise.resolve(L().daily.filter(function(x){return x.d>=from&&x.d<=to}));
  return sb.from('oee_daily').select('*').gte('d',from).lte('d',to).order('d').then(chk)},

  return sb.from('oee_daily').upsert(row,{onConflict:'d,line'}).then(chk)},
 stops:function(from,to){if(DEMO)return Promise.resolve(L().stops.filter(function(x){return x.d>=from&&x.d<=to}));
  return sb.from('oee_stops').select('*').gte('d',from).lte('d',to).order('d').range(0,9999).then(chk)},
 addStops:function(rows){rows.forEach(function(r){r.created_by=ME.name});if(DEMO){var o=L();rows.forEach(function(r){r.id=o.seq++;o.stops.push(r)});LW(o);return Promise.resolve()}
  return sb.from('oee_stops').insert(rows).then(chk)},
 updStop:function(id,patch){if(DEMO){var o=L();o.stops.forEach(function(x){if(x.id===id)Object.assign(x,patch)});LW(o);return Promise.resolve()}
  return sb.from('oee_stops').update(patch).eq('id',id).then(chk)},
 delStop:function(id){if(DEMO){var o=L();o.stops=o.stops.filter(function(x){return x.id!==id});LW(o);return Promise.resolve()}
  return sb.from('oee_stops').delete().eq('id',id).then(chk)},
 roster:function(){if(DEMO)return Promise.resolve(L().roster.slice().sort(function(a,b){return a.ord-b.ord}));return sb.from('roster').select('*').order('ord').then(chk)},
 saveRoster:function(rows){if(DEMO){var o=L();rows.forEach(function(r){o.roster=o.roster.filter(function(x){return x.name!==r.name});o.roster.push(r)});LW(o);return Promise.resolve()}
  return sb.from('roster').upsert(rows,{onConflict:'name'}).then(chk)},
 delRoster:function(name){if(DEMO){var o=L();o.roster=o.roster.filter(function(x){return x.name!==name});LW(o);return Promise.resolve()}return sb.from('roster').delete().eq('name',name).then(chk)},
 off:function(ym){if(DEMO)return Promise.resolve(L().off.filter(function(x){return x.ym===ym}));return sb.from('off_cells').select('*').eq('ym',ym).range(0,9999).then(chk)},
 setOff:function(rows){var put=rows.filter(function(r){return r.val}),del=rows.filter(function(r){return !r.val});
  put.forEach(function(r){r.updated_by=ME.name;r.updated_at=new Date().toISOString()});
  if(DEMO){var o=L();rows.forEach(function(r){o.off=o.off.filter(function(x){return !(x.ym===r.ym&&x.name===r.name&&x.day===r.day)})});o.off=o.off.concat(put);LW(o);return Promise.resolve()}
  var p=Promise.resolve();if(put.length)p=p.then(function(){return sb.from('off_cells').upsert(put,{onConflict:'ym,name,day'}).then(chk)});
  del.forEach(function(r){p=p.then(function(){return sb.from('off_cells').delete().eq('ym',r.ym).eq('name',r.name).eq('day',r.day).then(chk)})});return p},
 hp:function(from,to){if(DEMO)return Promise.resolve((L().hp||[]).filter(function(x){return x.d>=from&&x.d<=to}));return sb.from('hp_days').select('*').gte('d',from).lte('d',to).then(chk)},
 saveHp:function(row){row=Object.assign({},row);row.updated_by=ME.name;row.updated_at=new Date().toISOString();
  if(DEMO){var o=L();o.hp=(o.hp||[]).filter(function(x){return !(x.d===row.d&&x.kind===row.kind)});o.hp.push(row);LW(o);return Promise.resolve()}
  return sb.from('hp_days').upsert(row,{onConflict:'d,kind'}).then(chk)},
 delHp:function(d,kind){if(DEMO){var o=L();o.hp=(o.hp||[]).filter(function(x){return !(x.d===d&&x.kind===kind)});LW(o);return Promise.resolve()}return sb.from('hp_days').delete().eq('d',d).eq('kind',kind).then(chk)},
 sterJournal:function(from,to){if(DEMO)return Promise.resolve(L().ster||[]);return sb.from('ster_journal').select('d,unit,idx,rec').gte('d',from).lte('d',to).range(0,9999).then(chk)},
 syncInfo:function(){if(DEMO)return Promise.resolve(null);return sb.from('sync_log').select('*').eq('k','ster').maybeSingle().then(chk)},
 sterSync:function(from,to){if(DEMO)return Promise.reject(new Error('데모 모드에서는 받을 수 없습니다'));
  return sb.functions.invoke('ster-sync',{body:{from:from,to:to}}).then(async function(r){if(r.error){var m=r.error.message;try{var b=await r.error.context.json();if(b&&b.error)m=b.error}catch(e){}throw new Error(m)}if(r.data&&r.data.error)throw new Error(r.data.error);return r.data})},
 profiles:function(){if(DEMO)return Promise.resolve([ME]);return sb.from('profiles').select('*').order('created_at').then(chk)},
 setProfile:function(id,patch){if(DEMO)return Promise.resolve();return sb.from('profiles').update(patch).eq('id',id).then(chk)}
};
function errMsg(e){var m=(e&&(e.message||e.error_description))||String(e);
 if(/row-level security|permission|violates/i.test(m))return '권한이 없습니다. 관리자 승인이 필요하거나, 본인 줄이 아닙니다.';
 if(/Failed to fetch|NetworkError/i.test(m))return '서버에 연결하지 못했습니다. 네트워크를 확인하세요.';
 if(/column .* does not exist|Could not find the .* column/i.test(m))return '데이터베이스 업데이트가 필요합니다. README의 「업데이트 SQL」을 실행하세요.';
 return m}
function fail(e){console.error(e);toast('저장하지 못했습니다: '+errMsg(e))}

/* ================= 데이터: 생산 기록 (재현 포털 · Firestore, 읽기 전용) =================
   runs_log  : 종료한 생산 — mi(0=A…5=F) · item · start · end(ms) · plan · produced · rate · stopMin
   stops_log : 정지 — mi · sMs · eMs · min · eq(설비) · loc(위치) · prob(문제점) · act(조치)
   run_cur   : 지금 생산 중 — 종료 전이라 OEE 계산에서는 빠짐 */
var FS={project:CFG.fbProject||'yonsei-portal',key:CFG.fbKey||'AIzaSyCyiOdByojO__mmGUZYy_jnyZ17cZ7zuk8',site:CFG.runSite||'https://jaehyun3163-blip.github.io/yonsei/'};
var MC='ABCDEF';
var SIP_EST={A:70,B:70,C:70,D:70,E:70,F:100};   /* SIP 시작을 모를 때: 생산 시작 전(분) 추정 — 엑셀 실적 기준 */
var SRC={runs:[],stops:[],cur:[],at:0,state:'idle',err:''};
function fsVal(v){if(!v)return null;if('stringValue' in v)return v.stringValue;if('integerValue' in v)return +v.integerValue;if('doubleValue' in v)return v.doubleValue;if('booleanValue' in v)return v.booleanValue;if('nullValue' in v)return null;
 if('arrayValue' in v)return (v.arrayValue.values||[]).map(fsVal);if('mapValue' in v){var o={};Object.keys(v.mapValue.fields||{}).forEach(function(k){o[k]=fsVal(v.mapValue.fields[k])});return o}return null}
function fsDoc(d){var f=d.fields||{},o;if(f.j&&f.j.stringValue!=null){try{o=JSON.parse(f.j.stringValue)}catch(e){o={}}}else{o={};Object.keys(f).forEach(function(k){o[k]=fsVal(f[k])})}o._id=d.name.split('/').pop();return o}
async function fsList(col){var out=[],tok='',base='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(FS.project)+'/databases/(default)/documents/'+col+'?pageSize=300&key='+encodeURIComponent(FS.key);
 for(var i=0;i<40;i++){var r=await fetch(base+(tok?'&pageToken='+encodeURIComponent(tok):''));if(!r.ok){var t=await r.text();throw new Error('생산 기록을 읽지 못했습니다 ('+r.status+') '+t.slice(0,120))}
  var j=await r.json();(j.documents||[]).forEach(function(d){out.push(fsDoc(d))});if(!j.nextPageToken)break;tok=j.nextPageToken}return out}
async function srcPull(force){if(!force&&SRC.state==='ok'&&Date.now()-SRC.at<2*60e3)return;SRC.state='loading';
 try{var a=await Promise.all([fsList('runs_log'),fsList('stops_log'),fsList('run_cur')]);
  SRC.runs=a[0].filter(function(x){return x.start&&x.end&&x.mi!=null});SRC.stops=a[1].filter(function(x){return x.sMs&&x.eMs&&x.mi!=null});SRC.cur=a[2];SRC.at=Date.now();SRC.state='ok';SRC.err=''}
 catch(e){SRC.state='error';SRC.err=errMsg(e)}}
function dkey(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mod(ms){var d=new Date(ms);return d.getHours()*60+d.getMinutes()}
function stopText(x){return [x.eq,x.loc,x.prob,x.act].filter(function(t){return t&&t!=='-'}).join(' · ')}
function srcDays(from,to){var out={},by={};
 SRC.runs.forEach(function(r){var D=dkey(r.start);if(D<from||D>to)return;var k=D+'|'+MC[r.mi];(by[k]=by[k]||[]).push(r)});
 Object.keys(by).forEach(function(k){var rs=by[k].sort(function(a,b){return a.start-b.start}),p=k.split('|'),o={d:p[0],line:p[1],runs:rs,stops:[]};
  o.psMs=rs[0].start;o.peMs=rs.reduce(function(m,r){return Math.max(m,r.end)},0);o.ps=mod(o.psMs);o.pe=mod(o.peMs);
  o.qty=rs.reduce(function(t,r){return t+(+r.produced||0)},0);o.plan=rs.reduce(function(t,r){return t+(+r.plan||0)},0);
  var seen={};o.item=rs.map(function(r){return r.item}).filter(function(x){if(!x||seen[x])return false;seen[x]=1;return true}).join(', ');
  rs.forEach(function(r,i){var mine=SRC.stops.filter(function(x){return x.mi===r.mi&&x.sMs>=r.start&&x.sMs<r.end&&!/선물/.test(x.eq||'')});   /* 선물포장기 정지는 포장기 OEE에서 제외 */
   mine.forEach(function(x){o.stops.push({a:mod(x.sMs),b:mod(x.eMs),aMs:x.sMs,m:Math.max(0,Math.round((Math.min(x.eMs,r.end)-x.sMs)/60000)),why:stopText(x),src:'정지 기록'})});
   if(!mine.length&&(+r.stopMin||0)>0)o.stops.push({a:mod(r.start),b:null,aMs:r.start,m:+r.stopMin,why:'정지 합계 (상세 기록 없음)',src:'생산 기록'});
   var nx=rs[i+1];if(nx&&nx.start>r.end){var g=Math.round((nx.start-r.end)/60000);if(g>0)o.stops.push({a:mod(r.end),b:mod(nx.start),aMs:r.end,m:g,why:'품목 교체 — '+(r.item||'')+' → '+(nx.item||''),src:'생산 기록 사이',code:3})}});
  o.stops.sort(function(a,b){return a.aMs-b.aMs});
  /* 정격 속도는 생산 기록에 적힌 값(run.rate), 없으면 기준 CAPA */
  o.ideal=rs.reduce(function(t,r){var rate=+r.rate||capOf(o.line,o.d),own=o.stops.filter(function(x){return x.aMs>=r.start&&x.aMs<r.end&&x.src!=='생산 기록 사이'}).reduce(function(s,x){return s+(x.m||0)},0);
   return t+rate*Math.max(0,(r.end-r.start)/60000-own)/60},0);
  o.rate=rs[rs.length-1].rate||capOf(o.line,o.d);o.prodSpanMs=Math.round((o.peMs-o.psMs)/60000);out[k]=o});
 return out}
function curRuns(){return (SRC.cur||[]).filter(function(r){return r&&r.start}).map(function(r){return {line:r._id,item:r.item,start:r.start,plan:r.plan,rate:r.rate}})}

/* ================= 멸균팀 업무일지 → 멸균기 생산량(L) ================= */
var STER={rows:[],info:null,state:'idle',err:''};
function recKey(r,re){var ks=Object.keys(r||{});for(var i=0;i<ks.length;i++)if(re.test(ks[i]))return ks[i];return null}
function recL(r){var k=recKey(r,/생산량.*L|^L$|liter|litre|prodL|qtyL|amountL|volL|totalL|^l_|_l$/i)||recKey(r,/생산량|prod(uct)?(ion)?_?qty|amount|volume/i);return k?num(r[k]):null}

/* 부문 업무포털 연동 로그인: 부문 포털에 로그인 → 그 토큰을 포장팀 Supabase 함수(portal-login)가 확인 → 포장팀 계정으로 로그인 */
async function ssoLogin(emp,pw){
 if(!PC())throw new Error('부문 업무포털에 연결하지 못했습니다 (인터넷 확인)');
 if(!(await portalLogin(emp,pw)))throw new Error('사번 또는 비밀번호가 맞지 않습니다 (부문 업무포털 기준).');
 var se=(await PC().auth.getSession()).data.session;if(!se)throw new Error('부문 업무포털 로그인을 확인하지 못했습니다.');
 var r;try{r=await fetch(CFG.url.replace(/\/$/,'')+'/functions/v1/portal-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key},body:JSON.stringify({token:se.access_token})})}
 catch(e){throw new Error('연동 로그인 기능에 닿지 못했습니다. 관리자가 portal-login 기능을 올렸는지 확인해 주세요. (그동안은 아래 「포장팀 사이트 계정으로 로그인」)')}
 var j={};try{j=await r.json()}catch(e){}
 if(r.status===404)throw new Error('연동 로그인 기능(portal-login)이 아직 올라가 있지 않습니다. 그동안은 아래 「포장팀 사이트 계정으로 로그인」을 쓰세요.');
 if(r.status===401&&!j.error)throw new Error('portal-login 기능 설정에서 JWT 검사(Verify JWT)를 꺼 주세요.');
 if(!r.ok||!j.token_hash)throw new Error(j.error||j.message||('연동 로그인 실패 ('+r.status+')'));
 var v=await sb.auth.verifyOtp({token_hash:j.token_hash,type:'magiclink'});if(v.error)throw v.error;
 PD.state='idle';return j}
function bindAuth(mode){mode=mode||'login';$('#authForm').addEventListener('submit',async function(e){e.preventDefault();var emp=$('#a-emp').value.trim().toLowerCase(),pw=$('#a-pw').value,msg=$('#a-msg'),btn=this.querySelector('button');msg.hidden=true;
  if(!/^[a-z0-9._-]+$/i.test(emp)&&emp.indexOf('@')<0){msg.textContent='사번은 영문·숫자로 입력하세요.';msg.hidden=false;return}
  btn.disabled=true;var bt=btn.textContent;btn.textContent='확인 중…';
  var email=authEmail(emp),r;
  try{if(mode==='login'){await ssoLogin(emp,pw);await boot();return}
   if(mode==='join'){r=await sb.auth.signUp({email:email,password:pw,options:{data:{name:$('#a-name').value.trim(),emp_no:emp}}});if(r.error)throw r.error;if(!r.data.session)r=await sb.auth.signInWithPassword({email:email,password:pw})}
   else r=await sb.auth.signInWithPassword({email:email,password:pw});if(r.error)throw r.error;await boot()}
  catch(err){var m=errMsg(err);if(/Invalid login/i.test(m))m='사번 또는 비밀번호가 맞지 않습니다.';if(/already registered/i.test(m))m='이미 가입된 사번입니다. 로그인하세요.';if(/Email not confirmed/i.test(m))m='Supabase에서 Confirm email을 꺼야 합니다.';if(/email address .* is invalid/i.test(m))m='가입용 주소 형식을 Supabase가 받지 않습니다. config.js의 emailPattern을 실제 메일 도메인으로 바꿔 주세요.';msg.textContent=m;msg.hidden=false}
  finally{btn.disabled=false;btn.textContent=bt}})}

 [].forEach.call(M.querySelectorAll('[data-p]'),function(b){b.addEventListener('click',function(){var a2=b.dataset.a,p=a2==='on'?{approved:true}:a2==='off'?{approved:false}:{role:a2};api.setProfile(b.dataset.p,p).then(function(){toast('바꿨습니다');route()}).catch(fail)})});
 $('#rAdd').addEventListener('submit',function(e){e.preventDefault();var n=$('#r-n').value.trim(),g=+$('#r-g').value;if(!n)return;var mx=R.reduce(function(m,p){return Math.max(m,p.ord)},0);

function needXLSX(){if(window.XLSX)return Promise.resolve();return new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=function(){no(new Error('엑셀 읽기 도구를 불러오지 못했습니다'))};document.head.appendChild(s)})}
function importFile(f,fn){if(!f)return;var box=$('#x-msg');box.innerHTML='<div class="notice info">읽는 중…</div>';
 needXLSX().then(function(){return f.arrayBuffer()}).then(function(buf){return fn(XLSX.read(buf,{type:'array'}))})
  .then(function(t){box.innerHTML='<div class="notice info">'+esc(t)+'</div>'}).catch(function(e){console.error(e);box.innerHTML='<div class="notice err">가져오지 못했습니다: '+esc(errMsg(e))+'</div>'})}
function xDate(v){if(v==null||v==='')return null;if(typeof v==='number'){var d=XLSX.SSF.parse_date_code(v);return d?d.y+'-'+pad(d.m)+'-'+pad(d.d):null}var m=String(v).match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):null}
function xTime(v){if(v==null||v==='')return null;if(typeof v==='number')return hm(Math.round((v%1)*1440));var m=tmin(v);return m==null?null:hm(m)}
function cellV(ws,r,c){var x=ws[XLSX.utils.encode_cell({r:r,c:c})];return x?x.v:null}
async function importOee(wb){var d=wb.Sheets['일일입력'],s=wb.Sheets['정지기록'];if(!d||!s)throw new Error('「일일입력」 · 「정지기록」 시트가 없습니다');
 var rg=XLSX.utils.decode_range(d['!ref']),days=[];
 for(var r=5;r<=rg.e.r;r++){var D=xDate(cellV(d,r,0)),h=String(cellV(d,r,2)||'').trim().toUpperCase();if(!D||LINES.indexOf(h)<0)continue;var qty=cellV(d,r,11),ps=xTime(cellV(d,r,8));if(qty==null&&!ps)continue;
  days.push({d:D,line:h,ster:cellV(d,r,3)==null?null:String(cellV(d,r,3)),item:cellV(d,r,4)||null,ml:num(cellV(d,r,5)),order_qty:num(cellV(d,r,6)),sip:xTime(cellV(d,r,7)),ps:ps,pe:xTime(cellV(d,r,9)),cip:xTime(cellV(d,r,10)),qty:num(qty),ster_l:num(cellV(d,r,12)),note:cellV(d,r,13)||null})}
 var rs=XLSX.utils.decode_range(s['!ref']),st=[];
 for(var r2=4;r2<=rs.e.r;r2++){var D2=xDate(cellV(s,r2,0)),h2=String(cellV(s,r2,1)||'').trim().toUpperCase();if(!D2||LINES.indexOf(h2)<0)continue;
  st.push({d:D2,line:h2,t_start:xTime(cellV(s,r2,2)),t_end:xTime(cellV(s,r2,3)),code:num(cellV(s,r2,4)),brk:String(cellV(s,r2,7)||'N').toUpperCase(),content:cellV(s,r2,8)==null?null:String(cellV(s,r2,8))})}
 if(!days.length)throw new Error('가져올 일일 입력이 없습니다');
 for(var i=0;i<days.length;i++)await api.saveDaily(days[i]);
 var keys={};days.concat(st).forEach(function(x){keys[x.d+'|'+x.line]=1});var ks=Object.keys(keys).sort(),from=ks[0].slice(0,10),to=ks[ks.length-1].slice(0,10),old=await api.stops(from,to);
 for(var j=0;j<old.length;j++)if(keys[old[j].d+'|'+old[j].line])await api.delStop(old[j].id);
 for(var k=0;k<st.length;k+=200)await api.addStops(st.slice(k,k+200));
 return '일일 기록 '+days.length+'건, 정지 기록 '+st.length+'건을 가져왔습니다 ('+md(from)+' ~ '+md(to)+').'}
async function importOff(wb){var names=wb.SheetNames.filter(function(n){return /휴무표/.test(n)});if(!names.length)throw new Error('「휴무표」 시트가 없습니다');
 var roster=null,cells=[],months=[];
 names.forEach(function(sn){var ws=wb.Sheets[sn],m=String(cellV(ws,0,0)||'').match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);if(!m)return;var ym=m[1]+'-'+pad(m[2]);months.push(ym);
  var rg=XLSX.utils.decode_range(ws['!ref']),cols=[];for(var c=2;c<=rg.e.c;c++){var dd=num(cellV(ws,3,c));if(dd)cols.push([c,dd])}
  var list=[],g2=null;
  for(var r=5;r<=rg.e.r;r++){var a=cellV(ws,r,0),n=cellV(ws,r,1);
   if(n==null||String(n).trim()===''){var gm=String(a||'').match(/2[조팀]\s*\(\s*(\d+)\s*~/);if(gm)g2=+gm[1];continue}
   n=String(n).trim();list.push({name:n,ord:num(a)||list.length+1});
   cols.forEach(function(cd){var v=cellV(ws,r,cd[0]);if(v!=null&&String(v).trim()!=='')cells.push({ym:ym,name:n,day:cd[1],val:String(v).trim()})})}
  list.forEach(function(p){p.grp=(g2&&p.ord>=g2)?2:1});if(!roster||ym>roster.ym)roster={ym:ym,list:list}});
 if(!roster)throw new Error('시트 제목에서 「2026년 11월」 같은 연월을 찾지 못했습니다');
 var prevR={};(await api.roster()).forEach(function(x){prevR[x.name]=x.grp});   /* 관리자가 바꿔 둔 팀은 그대로 둠 */
 await api.saveRoster(roster.list.map(function(p,i){return {name:p.name,grp:prevR[p.name]||p.grp,ord:i+1}}));
 for(var k=0;k<cells.length;k+=300)await api.setOff(cells.slice(k,k+300));
 return '명단 '+roster.list.length+'명('+roster.ym+' 기준)과 휴무 표시 '+cells.length+'칸을 가져왔습니다 ('+months.sort().join(', ')+').'}
